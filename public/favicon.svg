<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark Cartographic Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#071018" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Outer Teal Radar Ring & Meridian -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.85" />
  <ellipse cx="32" cy="32" rx="9" ry="20" fill="none" stroke="#2dd4bf" stroke-width="1.4" opacity="0.55" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="#2dd4bf" stroke-width="1.4" opacity="0.55" />

  <!-- Compass Needle (North-East Amber / South-West Teal) -->
  <polygon points="43,21 35,35 29,29" fill="#fbbf24" />
  <polygon points="21,43 29,29 35,35" fill="#2dd4bf" />

  <!-- Center Target Pivot -->
  <circle cx="32" cy="32" r="3" fill="#fef08a" stroke="#071018" stroke-width="1.2" />
</svg>